<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">MedRec Starter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>window.IS_GITHUB_PAGES_DEMO = false;</script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- ============================================
       TOP BAR (selalu visible) — clinic name + login/user di pojok kanan atas
       ============================================ -->
  <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <div class="font-bold text-blue-600 text-lg" id="clinicNameTop">MedRec Starter</div>
      <span id="userBadgeTop" class="ml-2 px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-700 hidden">Belum login</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="btnLoginTop" onclick="toggleLogin()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M12 12a3 3 0 10-6 0 3 3 0 006 0zM12 12a3 3 0 10-6 0 3 3 0 006 0z"></path></svg>
        <span id="btnLoginText">Masuk</span>
      </button>
    </div>
  </header>

  <!-- ============================================
       DESKTOP SIDEBAR — hanya muncul saat login staff/superadmin
       ============================================ -->
  <aside id="sidebarDesktop" class="hidden md:flex md:fixed md:inset-y-0 md:left-0 md:w-64 bg-white border-r border-gray-200 flex-col z-40">
    <div class="p-5 border-b border-gray-200">
      <div class="font-bold text-blue-600 text-lg" id="clinicName">MedRec Starter</div>
      <div class="text-xs text-gray-500 mt-1" id="userInfo">-</div>
    </div>
    <nav class="flex-1 p-3 space-y-1">
      <button onclick="switchTab('home')" class="navbtn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50 flex items-center gap-3" data-tab="home">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span>Beranda</span>
      </button>
      <button onclick="switchTab('pasien')" class="navbtn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50 flex items-center gap-3" data-tab="pasien">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        <span>Pasien</span>
      </button>
      <button onclick="switchTab('icd')" class="navbtn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50 flex items-center gap-3" data-tab="icd">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <span>ICD-10</span>
      </button>
      <button onclick="switchTab('daftar')" class="navbtn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50 flex items-center gap-3" data-tab="daftar">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
        <span>Pendaftaran</span>
      </button>
      <button onclick="switchTab('pesan')" class="navbtn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50 flex items-center gap-3" data-tab="pesan">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Pesan Pasien</span>
      </button>
      <button onclick="switchTab('modular')" class="navbtn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50 flex items-center gap-3 hidden" data-tab="modular" id="navModularDesktop">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 100-4H7a1 1 0 011-1h1a2 2 0 100-4H7a1 1 0 011-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>
        <span>Modular</span>
      </button>
      <button onclick="switchTab('addons')" class="navbtn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50 flex items-center gap-3 hidden" data-tab="addons" id="navAddonsDesktop">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        <span>Add Ons</span>
      </button>
      <button onclick="switchTab('dokumentasi')" class="navbtn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50 flex items-center gap-3 hidden" data-tab="dokumentasi" id="navDokumentasiDesktop">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        <span>Dokumentasi</span>
      </button>
      <button onclick="switchTab('settings')" class="navbtn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50 flex items-center gap-3" data-tab="settings">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94 1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span>Settings</span>
      </button>
    </nav>
    <div class="p-3 border-t border-gray-200">
      <button onclick="logout()" class="w-full text-left px-3 py-2 rounded-lg text-red-600 hover:bg-red-50">🚪 Keluar</button>
    </div>
  </aside>

  <!-- ============================================
       MAIN CONTENT
       ============================================ -->
  <main class="min-h-screen pt-16 md:ml-64 pb-24 md:pb-28">
    <div class="p-4 md:p-6 max-w-6xl mx-auto" id="viewContainer"></div>
  </main>

  <!-- ============================================
       BOTTOM NAV — Home | Pendaftaran | Jadwal (selalu visible)
       ============================================ -->
  <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center py-2 z-50 shadow-lg">
    <button onclick="switchTab('home')" class="mobnav flex flex-col items-center text-gray-500" data-tab="home">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-xs mt-1">Beranda</span>
    </button>
    <button onclick="switchTab('daftar')"
            class="mobnav flex flex-col items-center text-gray-500 relative" data-tab="daftar">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
      <span class="text-xs mt-1">Pendaftaran</span>
      <span id="antrianCountBadge" class="absolute top-1 right-1 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span>
    </button>
    <button onclick="switchTab('jadwal')" class="mobnav flex flex-col items-center text-gray-500" data-tab="jadwal">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
      <span class="text-xs mt-1">Jadwal</span>
    </button>
  </nav>

  <!-- ============================================
       LOGIN MODAL (overlay)
       ============================================ -->
  <div id="loginModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Masuk</h2>
        <p class="text-gray-500 text-sm mt-1">Login untuk mengakses panel petugas & dokter</p>
      </div>
      <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input id="username" type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="password" type="password" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div id="loginErr" class="text-red-600 text-sm hidden"></div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg">Masuk</button>
      </form>
      <div class="mt-6 text-xs text-gray-400 text-center">
        Demo: admin/admin123 · petugas/petugas123 · dokter/dokter123
      </div>
    </div>
  </div>

  <script src="/js/config-demo.js" onerror="window.IS_GITHUB_PAGES_DEMO=false;"></script>
  <script src="/js/moduleBuilder.js"></script>
  <script src="/modules/home/client.js"></script>
  <script src="/modules/pasien/client.js"></script>
  <script src="/modules/icd/client.js"></script>
  <script src="/modules/daftar/client.js"></script>
  <script src="/modules/akun/client.js"></script>
  <script src="/modules/modular/client.js"></script>
  <script src="/modules/dokumentasi/client.js"></script>
  <script src="/modules/addons/client.js"></script>
  <script src="/js/popupHelper.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
